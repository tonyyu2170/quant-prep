name: ci
# workflow_dispatch is here because a run once wedged in `queued` for hours and could not be
# recovered: cancel reported it completed, rerun reported it running, force-cancel reported
# it not yet queued, and `run view` reported it queued — four contradictory states for one
# run. With only push and pull_request triggers the sole way to get CI to run again was a
# dummy commit. This lets anyone re-dispatch from the Actions tab or `gh workflow run ci`.
on: [push, pull_request, workflow_dispatch]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit:traps
      - run: npm run verify:emit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: verification/requirements.txt
      - run: pip install -r verification/requirements.txt
      - run: npm run verify:fermi-emit
      - run: python3 verification/verify_fermi.py
      - run: python3 verification/verify.py
